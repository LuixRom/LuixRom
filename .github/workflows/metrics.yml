name: GitHub Metrics

on:
  schedule:
    # 05:00 UTC ~= 00:00 en Perú.
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"

jobs:
  github-metrics:
    name: Generate GitHub metrics
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Generate profile metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: LuixRom
          filename: github-metrics.svg
          template: classic
          config_timezone: America/Lima
          config_display: large
          config_order: >
            base.header,
            base.activity+community,
            languages,
            isocalendar

          base: header, activity, community, repositories, metadata
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: no

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_other: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_categories: programming, markup, data
          # Evita que archivos generados o de configuración distorsionen los resultados.
          plugin_languages_ignored: >
            Jupyter Notebook,
            Dockerfile

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Un plugin secundario no detendrá todo el workflow.
          plugins_errors_fatal: no
          output_action: commit
          committer_branch: main
          committer_message: "chore: update GitHub metrics"
